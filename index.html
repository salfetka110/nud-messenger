<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nud</title>
<style>
:root{--bg:#f4f5f9;--surf:#fff;--text:#14151a;--mute:#6b7080;--line:#e6e8ef;--acc:#6c5ce7;--acc2:#a463f2;--mine:#6c5ce7;--minet:#fff;--theirs:#eceef5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1015;--surf:#181a22;--text:#eceef5;--mute:#8d92a3;--line:#262935;--theirs:#232632}}
:root[data-theme="dark"]{--bg:#0f1015;--surf:#181a22;--text:#eceef5;--mute:#8d92a3;--line:#262935;--theirs:#232632}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input{font:inherit;color:inherit}
.logo{font-weight:800;letter-spacing:-.5px;background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.auth{height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:20px;padding:26px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
.card h1{margin:0;font-size:38px;text-align:center}.card p{margin:0;text-align:center;color:var(--mute)}
input[type=text]{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);outline:none}
input[type=text]:focus{border-color:var(--acc)}
.btn{border:0;border-radius:12px;padding:12px 16px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-weight:600;cursor:pointer}
.btn.ghost{background:var(--bg);color:var(--text);border:1px solid var(--line)}
.err{color:#e5484d;font-size:13px;min-height:16px;text-align:center}
.av{width:44px;height:44px;border-radius:50%;flex:none;object-fit:cover;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;overflow:hidden}
.av.big{width:92px;height:92px;font-size:34px}.av.sm{width:34px;height:34px;font-size:14px}
.pick{align-self:center;cursor:pointer;position:relative}.pick span{position:absolute;right:-2px;bottom:-2px;background:var(--acc);color:#fff;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border:3px solid var(--surf)}
.app{height:100%;display:flex}
.side{width:340px;max-width:100%;background:var(--surf);border-right:1px solid var(--line);display:flex;flex-direction:column;flex:none}
.head{display:flex;align-items:center;gap:10px;padding:12px 14px}.head .logo{font-size:24px;flex:1}
.me{cursor:pointer}
.search{padding:0 14px 10px}
.list{overflow:auto;flex:1}
.row{display:flex;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}.row:hover,.row.on{background:var(--bg)}
.row .t{flex:1;min-width:0}.row b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{color:var(--mute);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbl{padding:8px 14px;color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surf);border-bottom:1px solid var(--line)}
.back{display:none;border:0;background:none;font-size:22px;cursor:pointer}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:6px}
.m{max-width:78%;padding:8px 12px;border-radius:16px;background:var(--theirs);word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap}
.m.me{align-self:flex-end;background:var(--mine);color:var(--minet);border-bottom-right-radius:4px}.m:not(.me){border-bottom-left-radius:4px}
.m i{display:block;font-style:normal;font-size:11px;opacity:.6;text-align:right;margin-top:2px}
.compose{display:flex;gap:8px;padding:10px 14px;background:var(--surf);border-top:1px solid var(--line)}
.compose input{flex:1}
.empty{margin:auto;color:var(--mute);text-align:center;padding:20px}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}
@media (max-width:720px){.side{width:100%}.main{display:none}.app.chat .side{display:none}.app.chat .main{display:flex}.back{display:block}}
</style>
</head>
<body>
<div id="root"></div>
<input type="file" id="file" accept="image/*" hidden>
<script>
const $=s=>document.querySelector(s), root=$("#root");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const colors=["#6c5ce7","#e17055","#00b894","#0984e3","#d63031","#e84393","#fdcb6e","#00cec9"];
let db,user,uid,me=null,users={},chats=[],cur=null,unsubM=null,msgs=[],q="",regPhoto=null,editPhoto=null,ready=false,subbed=false,modal=false,pickTarget=null;
const cid=(a,b)=>[a,b].sort().join("__");
function av(u,cls=""){
  if(u&&u.photo)return `<img class="av ${cls}" src="${esc(u.photo)}" alt="">`;
  const n=(u&&(u.name||u.username))||"?";let h=0;for(const c of (u&&u.username)||n)h=(h*31+c.charCodeAt(0))%colors.length;
  return `<div class="av ${cls}" style="background:${colors[h]}">${esc(n[0].toUpperCase())}</div>`;
}
const time=t=>new Date(t).toLocaleTimeString("ru",{hour:"2-digit",minute:"2-digit"});
function resize(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=160,c=document.createElement("canvas");c.width=c.height=s;const x=c.getContext("2d"),m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,s,s);res(c.toDataURL("image/jpeg",.8))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
$("#file").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;const d=await resize(f);if(pickTarget==="reg")regPhoto=d;else editPhoto=d;
  const el=document.querySelector("[data-pick] .av");if(el){el.outerHTML=`<img class="av big" src="${d}" alt="">`}};
function pickPhoto(t){pickTarget=t;$("#file").click()}

async function init(){
  db=await claude.use("db");user=await claude.use("user");
  if(!db||!user){root.innerHTML='<div class="empty">Nud работает только для вошедших пользователей Claude.</div>';return}
  uid=await user.id();
  db.collection("users").onSnapshot(s=>{users={};s.docs.forEach(d=>users[d.id]=d.data());me=Object.values(users).find(u=>u.uid===uid)||null;ready=true;
    if(me&&!subbed){subbed=true;db.collection("chats").where("members","array-contains",me.username).onSnapshot(c=>{chats=c.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.ts-a.ts);if(!modal)render()})}
    if(!modal)render()},e=>{root.innerHTML='<div class="empty">Нет доступа к данным</div>'});
}
function render(){
  if(!ready)return;
  if(!me)return renderAuth();
  const active=document.activeElement&&document.activeElement.id,val=active?document.activeElement.value:"";
  const peer=cur?cur.split("__").find(x=>x!==me.username):null,pu=peer?users[peer]:null;
  let list="";
  if(q.trim()){
    const k=q.trim().toLowerCase().replace(/^@/,"");
    const f=Object.values(users).filter(u=>u.username!==me.username&&(u.username.includes(k)||(u.name||"").toLowerCase().includes(k)));
    list=`<div class="lbl">Пользователи</div>`+(f.map(u=>row(u,"@"+u.username,cid(me.username,u.username))).join("")||`<div class="empty">Никого не найдено</div>`);
  }else{
    list=chats.map(c=>{const p=c.members.find(x=>x!==me.username),u=users[p]||{username:p,name:p};return row(u,c.last||"",c.id)}).join("")||`<div class="empty">Чатов пока нет.<br>Найдите друга по @username выше.</div>`;
  }
  root.innerHTML=`<div class="app ${cur?"chat":""}">
  <div class="side"><div class="head"><span class="logo">Nud</span><div class="me" data-act="profile">${av(me,"sm")}</div></div>
  <div class="search"><input type="text" id="q" placeholder="Поиск по @username" value="${esc(q)}"></div>
  <div class="list">${list}</div></div>
  <div class="main">${cur?`<div class="top"><button class="back" data-act="back">←</button>${av(pu,"sm")}<div><b>${esc(pu?pu.name:peer)}</b><small style="display:block;color:var(--mute)">@${esc(peer)}</small></div></div>
  <div class="msgs" id="msgs"></div>
  <div class="compose"><input type="text" id="msg" placeholder="Сообщение" autocomplete="off"><button class="btn" data-act="send">➤</button></div>`:`<div class="empty">Выберите чат или найдите человека по @username</div>`}</div></div>`;
  fillMsgs();
  if(active){const el=document.getElementById(active);if(el){el.focus();if(el.type==="text")el.setSelectionRange(val.length,val.length)}}
}
const row=(u,sub,id)=>`<div class="row ${cur===id?"on":""}" data-chat="${esc(id)}">${av(u)}<div class="t"><b>${esc(u.name||u.username)}</b><small>${esc(sub)}</small></div></div>`;
function fillMsgs(){
  const el=document.getElementById("msgs");if(!el)return;
  el.innerHTML=msgs.length?msgs.map(m=>`<div class="m ${m.from===me.username?"me":""}">${esc(m.text)}<i>${time(m.ts)}</i></div>`).join(""):`<div class="empty">Напишите первое сообщение</div>`;
  el.scrollTop=el.scrollHeight;
}
function openChat(id){
  cur=id;msgs=[];if(unsubM)unsubM();
  unsubM=db.collection("chats/"+id+"/msgs").orderBy("ts").limit(300).onSnapshot(s=>{msgs=s.docs.map(d=>d.data());fillMsgs()});
  render();setTimeout(()=>document.getElementById("msg")?.focus(),50);
}
async function send(){
  const el=document.getElementById("msg"),t=el.value.trim();if(!t||!cur)return;el.value="";
  const ts=Date.now();
  try{
    await db.doc("chats/"+cur).set({members:cur.split("__"),last:t.slice(0,60),ts});
    await db.collection("chats/"+cur+"/msgs").add({from:me.username,text:t.slice(0,2000),ts});
  }catch(e){el.value=t}
}
function renderAuth(){
  root.innerHTML=`<div class="auth"><div class="card"><h1 class="logo">Nud</h1><p>Мини-мессенджер. Создайте профиль, чтобы начать общаться.</p>
  <div class="pick" data-pick="reg">${av({name:"+"},"big")}<span>+</span></div>
  <input type="text" id="un" placeholder="username (a–z, 0–9, _)" maxlength="20" autocapitalize="off" autocomplete="off">
  <input type="text" id="nm" placeholder="Имя" maxlength="30">
  <div class="err" id="err"></div><button class="btn" data-act="reg">Зарегистрироваться</button></div></div>`;
  if(regPhoto)document.querySelector("[data-pick] .av").outerHTML=`<img class="av big" src="${regPhoto}" alt="">`;
}
async function register(){
  const un=$("#un").value.trim().toLowerCase(),nm=$("#nm").value.trim(),err=$("#err");
  if(!/^[a-z0-9_]{3,20}$/.test(un))return err.textContent="Username: 3–20 символов, a–z, 0–9, _";
  if(!nm)return err.textContent="Введите имя";
  try{
    const ex=await db.doc("users/"+un).get();if(ex.exists)return err.textContent="Этот username уже занят";
    await db.doc("users/"+un).set({uid,username:un,name:nm,photo:regPhoto||"",created:Date.now()});
  }catch(e){err.textContent="Не удалось зарегистрироваться"}
}
function profile(){
  modal=true;editPhoto=null;
  const d=document.createElement("div");d.className="modal";
  d.innerHTML=`<div class="card"><div class="pick" data-pick="edit">${av(me,"big")}<span>✎</span></div><p>@${esc(me.username)}</p>
  <input type="text" id="enm" value="${esc(me.name)}" maxlength="30"><button class="btn" data-act="save">Сохранить</button><button class="btn ghost" data-act="close">Закрыть</button></div>`;
  document.body.appendChild(d);
}
function closeModal(){document.querySelector(".modal")?.remove();modal=false;render()}
document.addEventListener("click",async e=>{
  const p=e.target.closest("[data-pick]");if(p)return pickPhoto(p.dataset.pick);
  const c=e.target.closest("[data-chat]");if(c){q="";return openChat(c.dataset.chat)}
  const a=e.target.closest("[data-act]");if(!a)return;
  const k=a.dataset.act;
  if(k==="reg")register();
  else if(k==="send")send();
  else if(k==="back"){cur=null;if(unsubM)unsubM();msgs=[];render()}
  else if(k==="profile")profile();
  else if(k==="close")closeModal();
  else if(k==="save"){const n=$("#enm").value.trim()||me.name,u={name:n};if(editPhoto)u.photo=editPhoto;try{await db.doc("users/"+me.username).update(u)}catch(_){}closeModal()}
});
document.addEventListener("input",e=>{if(e.target.id==="q"){q=e.target.value;render()}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="msg")send();if(e.key==="Enter"&&(e.target.id==="un"||e.target.id==="nm"))register()});
init();
</script>
</body>
</html>
